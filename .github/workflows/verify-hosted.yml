name: Verify hosted submission
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public page and downloadable files
        shell: python
        run: |
          import hashlib, urllib.request
          expected = {'index.html': '4f71ce1a7ff6c563f6cc64792164d81425c7e7c0fb2368b93f0e5f637e2202a3', 'style.css': '05e20b0bb4f1aeceed487f519408a3653367eda7afce70ff50f56a39dfdd5d3c', 'script.js': 'c0d9c2f92b8ee4dae3171f22298f0efa65efde3c45f9dd261195d76c2ca0bb31', 'downloads/Splash-Screen-App.zip': '11b65842aede9fbe1e4c893a23de1891d696dab584f89ca8a656dbe1b1784f2c', 'downloads/Splash-Screen-App-Report.pdf': '63abe990399177000b374d43b18e2805aa9dfa6a79c982223a91c32c935a3e20', 'downloads/Splash-Screen-App.apk': '59201bc489172ba1cb341613d873a9eefe24037ce111ede3f403c29f078015ff'}
          base = 'https://engeyad.github.io/pynexia-week1-splash-screen/'
          for path, digest in expected.items():
              with urllib.request.urlopen(base + path, timeout=30) as response:
                  content = response.read()
                  assert response.status == 200
              assert hashlib.sha256(content).hexdigest() == digest, path
              print('HTTP 200 and SHA-256 match:', path)
